services:
  pico-rss:
    build: .
    # NOTES_DIR must be an absolute host path, e.g. NOTES_DIR=/home/user/my-rss-notes
    volumes:
      - "${NOTES_DIR}:/data:ro"
    environment:
      RSS_AUTHOR_NAME: "${RSS_AUTHOR_NAME}"
      RSS_AUTHOR_EMAIL: "${RSS_AUTHOR_EMAIL}"
      RSS_ORIGIN_URL: "${RSS_ORIGIN_URL}"
      RSS_FEED_TITLE: "${RSS_FEED_TITLE}"
      RSS_FEED_DESCRIPTION: "${RSS_FEED_DESCRIPTION}"
      RSS_TARGET_DIR: /data
      RSS_TIMEOUT: "${RSS_TIMEOUT}"
    ports:
      - "8066:8066"
    restart: unless-stopped
