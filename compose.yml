services:
  pico-rss:
    build: .
    # NOTES_DIR must be an absolute host path, e.g. NOTES_DIR=/home/user/my-rss-notes
    volumes:
      - "${NOTES_DIR}:/data:ro"
    environment:
      RSS_AUTHOR_USERNAME: "${RSS_AUTHOR_USERNAME}"
      RSS_ORIGIN_URL: "${RSS_ORIGIN_URL}"
      RSS_TARGET_DIR: /data
      RSS_HOST: "0.0.0.0"
      RSS_TIMEOUT: "${RSS_TIMEOUT}"
    ports:
      - "8066:8066"
    restart: unless-stopped
